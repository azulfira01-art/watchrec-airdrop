<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WatchRec Airdrop Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0e14; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { background: #161b22; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; }
    .badge { background: #1f6feb; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; text-align: center; }
    .card h3 { color: #58a6ff; margin-bottom: 8px; }
    .btn { background: #238636; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:active { background: #2ea043; }
    .btn-ad { background: #8957e5; }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge" id="balance">0 WRGP</div>
    <div class="badge" id="lives">❤️ 5/5</div>
  </div>

  <div class="content">
    <div class="card">
      <h3>WATCHREC GÜNLÜK ÖDÜL</h3>
      <p>Her gün giriş yap, ücretsiz WRGP kazan!</p>
      <button class="btn" onclick="claimDaily()">Ödülü Topla (+10 WRGP)</button>
    </div>

    <div class="card">
      <h3>MATCH-3 DÜELLO</h3>
      <p>Taşları eşleştir, rakibini yen ve WRGP kazan!</p>
      <button class="btn" onclick="playGame('Match-3')">OYNA (1 CAN)</button>
    </div>

    <div class="card">
      <h3>VOLFIED (ÇİZMECE)</h3>
      <p>Alanları kapat, canavarları hapset!</p>
      <button class="btn" onclick="playGame('Volfied')">OYNA (1 CAN)</button>
    </div>

    <div class="card">
      <h3>CAN HAKKIN BİTTİ Mİ?</h3>
      <p>Reklam izleyerek +1 Can kazan!</p>
      <button class="btn btn-ad" onclick="watchAd()">REKLAM İZLE (+1 CAN)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let wrgp = parseInt(localStorage.getItem('wrgp') || '100');
    let lives = parseInt(localStorage.getItem('lives') || '5');

    function updateUI() {
      document.getElementById('balance').innerText = wrgp + ' WRGP';
      document.getElementById('lives').innerText = '❤️ ' + lives + '/5';
    }

    function claimDaily() {
      wrgp += 10;
      localStorage.setItem('wrgp', wrgp);
      updateUI();
      alert('Tebrikler! 10 WRGP kazandınız.');
    }

    function playGame(gameName) {
      if (lives <= 0) {
        alert('Canınız kalmadı! Reklam izleyerek can kazanabilirsiniz.');
        return;
      }
      lives -= 1;
      wrgp += 15;
      localStorage.setItem('lives', lives);
      localStorage.setItem('wrgp', wrgp);
      updateUI();
      alert(gameName + ' oyunu başlatıldı! Kazandınız: +15 WRGP');
    }

    function watchAd() {
      if (lives >= 5) {
        alert('Canınız zaten dolu!');
        return;
      }
      lives += 1;
      localStorage.setItem('lives', lives);
      updateUI();
      alert('Reklam izlendi! +1 Can eklendi.');
    }

    updateUI();
  </script>
</body>
</html>
