<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WatchRec Game Center</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="pill gold">🪙 <b id="bal">0</b> WRGP</div>
    <div class="pill green">❤️ <b id="lives">5</b>/5</div>
    <img class="avatar" id="avatar" src="logo.png" alt="WatchRec">
  </header>

  <main>
    <div class="langbar"><span data-i18n="lang_title"></span><select id="langSel" aria-label="Language"></select></div>
    <!-- SEKME 1: OYUNLAR -->
    <section id="tab-games" class="tab active">
      <div class="gcard">
        <div class="cover c1"><span>💎</span><span>🍬</span><span>🔮</span></div>
        <div class="gbody">
          <h3 data-i18n="m3_title"></h3>
          <p data-i18n="m3_desc"></p>
          <div class="meta" data-i18n-html="m3_meta"></div>
          <button class="btn primary" data-play="m3" data-i18n="play"></button>
        </div>
      </div>
      <div class="gcard">
        <div class="cover c2"><span>👾</span><span>📐</span><span>⚡</span></div>
        <div class="gbody">
          <h3 data-i18n="vf_title"></h3>
          <p data-i18n="vf_desc"></p>
          <div class="meta" data-i18n-html="vf_meta"></div>
          <button class="btn primary" data-play="vf" data-i18n="play"></button>
        </div>
      </div>
      <div class="card" id="adBox">
        <p id="lifeTimer" class="muted"></p>
        <button class="btn gold" id="adBtn" data-i18n="ad_life"></button>
        <button class="btn gold" id="adWrgpBtn" data-i18n="ad_wrgp"></button>
      </div>
    </section>

    <!-- SEKME 2: GÜNLÜK ÖDÜL -->
    <section id="tab-daily" class="tab">
      <div class="card">
        <h2 data-i18n="daily_title"></h2>
        <p class="muted" data-i18n="daily_desc"></p>
        <div class="streak" id="streak"></div>
        <button class="btn primary" id="claimBtn"></button>
      </div>
    </section>

    <!-- SEKME 3: DAVET -->
    <section id="tab-invite" class="tab">
      <div class="card">
        <h2 data-i18n="inv_title"></h2>
        <p class="muted" data-i18n-html="inv_desc"></p>
        <div class="linkbox" id="refLink"></div>
        <div class="row">
          <button class="btn primary" id="copyBtn" data-i18n="copy"></button>
          <button class="btn" id="shareBtn" data-i18n="share"></button>
        </div>
        <p class="muted" style="margin-top:12px" data-i18n-html="inv_count"></p>
      </div>
    </section>

    <!-- SEKME 4: SIRALAMA -->
    <section id="tab-board" class="tab">
      <div class="card">
        <h2 data-i18n="board_title"></h2>
        <div id="boardList"></div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="active" data-tab="games"><i>🎮</i><span data-i18n="nav_games"></span></button>
    <button data-tab="daily"><i>🎁</i><span data-i18n="nav_daily"></span></button>
    <button data-tab="invite"><i>👥</i><span data-i18n="nav_invite"></span></button>
    <button data-tab="board"><i>🏆</i><span data-i18n="nav_board"></span></button>
  </nav>

  <!-- OYUN EKRANI -->
  <div id="game" class="overlay hidden">
    <div class="gbar">
      <button id="gQuit">✕</button>
      <div id="gTitle"></div>
      <div id="gInfo"></div>
    </div>
    <div class="gstage" id="gstage"><canvas id="cv"></canvas></div>
    <div id="gHint" class="muted"></div>
  </div>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
  <div id="toast"></div>
</div>

<script src="i18n.js"></script>
<script src="match3.js"></script>
<script src="volfied.js"></script>
<script src="app.js"></script>
</body>
</html>
